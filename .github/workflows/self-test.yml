name: Self-test (dry run)
on:
  workflow_dispatch:
    inputs:
      merged_branch:
        description: "Pretend this branch just merged"
        default: remapper-spec
        required: true
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      change: ${{ steps.next.outputs.change }}
      next: ${{ steps.next.outputs.next }}
    steps:
      - uses: actions/checkout@v5
      - id: next
        env:
          MERGED_BRANCH: ${{ inputs.merged_branch }}
        run: scripts/next_stage.sh "$MERGED_BRANCH" | tee -a "$GITHUB_OUTPUT"
  stage:
    needs: resolve
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    if: needs.resolve.outputs.next != 'none'
    uses: ./.github/workflows/handoff.yml
    with:
      stage: ${{ needs.resolve.outputs.next }}
      change: ${{ needs.resolve.outputs.change }}
      dry_run: true
    secrets: inherit
